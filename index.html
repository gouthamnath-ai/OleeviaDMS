<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oleevia DocFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Full logo on login / sidebar */
      img[alt="Oleevia"] {
        height: 6rem !important;
        width: auto !important;
        max-width: 320px !important;
        object-fit: contain !important;
        display: block !important;
      }
      /* Extra top space so logo is not clipped */
      body #root > div > div.w-full.max-w-sm {
        padding-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Remove "DOCFLOW" and "Sign in with your employee ID" labels on the login screen
      (function () {
        function clean() {
          document.querySelectorAll("p").forEach(function (p) {
            var t = (p.textContent || "").trim();
            if (t === "DOCFLOW" || t === "Sign in with your employee ID") {
              p.style.display = "none";
            }
          });
        }
        clean();
        new MutationObserver(clean).observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      })();
    </script>
  </body>
</html>
